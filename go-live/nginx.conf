events { worker_connections 4096; }
http {
  upstream quiz_workers {
    zone quiz_workers 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    least_conn;
    server go-live-a:8080 resolve max_fails=1 fail_timeout=2s;
    server go-live-b:8080 resolve max_fails=1 fail_timeout=2s;
  }
  server {
    listen 8080;
    location /health { proxy_pass http://quiz_workers; }
    location /ws/live/ {
      proxy_pass http://quiz_workers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_read_timeout 600s;
    }
  }
}
