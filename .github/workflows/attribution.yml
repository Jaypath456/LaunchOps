name: attribution
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit is Jay's, with no AI attribution lines
        run: |
          allowed='jaypathare123@gmail.com|84195294\+Jaypath456@users\.noreply\.github\.com|noreply@github\.com'
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then range="${{ github.sha }}"
          else range="${{ github.event.before }}..${{ github.sha }}"; fi
          bad_ident=$(git log --format='%h %ae %ce' $range | grep -Ev " ($allowed) ($allowed)$" || true)
          bad_msg=$(git log --format='%h %B' $range | grep -iE "co-authored-by:.*(claude|anthropic|codex|openai|chatgpt|copilot)|generated with .*(claude|codex)" || true)
          if [ -n "$bad_ident$bad_msg" ]; then echo "$bad_ident"; echo "$bad_msg"; exit 1; fi
