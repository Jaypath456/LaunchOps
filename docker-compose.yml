services:
  # Existing onboarding records stay in PostgreSQL until the documented
  # per-model migration is validated. Live-room answers use MongoDB.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-launchops_db}
      POSTGRES_USER: ${DB_USER:-launchops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-launchops_user} -d ${DB_NAME:-launchops_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs Django's cache, the Celery broker, the Channels layer, and
  # live-session state.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    profiles: ["live"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  go-live-a: &go_live
    build: ./go-live
    profiles: ["live"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment: &go_live_environment
      REDIS_ADDR: redis:6379
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: launchops_live
      BACKEND_URL: http://backend:8000
      LIVE_SERVICE_SECRET: ${LIVE_SERVICE_SECRET:-replace-this-local-demo-service-secret-before-deployment}
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000}

  go-live-b:
    <<: *go_live

  live-gateway:
    image: nginx:1.27-alpine
    profiles: ["live"]
    restart: unless-stopped
    depends_on:
      - go-live-a
      - go-live-b
    volumes:
      - ./go-live/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${LIVE_PORT:-19090}:8080"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-launchops_db}
      DB_USER: ${DB_USER:-launchops_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-compose-local-dev-secret-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000}
      # Only ever set to True for the "before" half of a loadtests/
      # before/after comparison (see loadtests/README.md) - defaults to
      # off (optimizations enabled) for normal use.
      LOAD_TEST_DISABLE_REDIS_OPTIMIZATIONS: ${LOAD_TEST_DISABLE_REDIS_OPTIMIZATIONS:-False}
      LIVE_SERVICE_SECRET: ${LIVE_SERVICE_SECRET:-replace-this-local-demo-service-secret-before-deployment}
      MONGO_URI: mongodb://mongo:27017
      LIVE_QUIZ_ENGINE: ${LIVE_QUIZ_ENGINE:-django}
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:18000/api}
      REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
      REACT_APP_LIVE_WS_URL: ${REACT_APP_LIVE_WS_URL:-ws://localhost:19090}
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  worker:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "lms_project", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-launchops_db}
      DB_USER: ${DB_USER:-launchops_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-compose-local-dev-secret-key}
      DEBUG: ${DEBUG:-True}

  beat:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "lms_project", "beat", "--loglevel=info"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-launchops_db}
      DB_USER: ${DB_USER:-launchops_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-compose-local-dev-secret-key}
      DEBUG: ${DEBUG:-True}

  # Not started by a normal `docker compose up` - gated behind the
  # "loadtest" profile so it only runs when explicitly requested, e.g.:
  #   docker compose --profile loadtest run --rm locust \
  #     --headless --users 100 --spawn-rate 20 --run-time 2m \
  #     --csv /reports/rest_100users
  # See loadtests/README.md for the full before/after methodology.
  locust:
    image: locustio/locust:2.44.4
    profiles: ["loadtest"]
    depends_on:
      - backend
    volumes:
      - ./loadtests:/mnt/locust
      - ./loadtests/reports:/reports
    working_dir: /mnt/locust
    entrypoint: ["locust", "-f", "locustfile.py", "--host", "http://backend:8000"]
    ports:
      - "8089:8089"

volumes:
  postgres_data:
  redis_data:
  mongo_data:
