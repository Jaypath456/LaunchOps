services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-launchops_db}
      POSTGRES_USER: ${DB_USER:-launchops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-launchops_user} -d ${DB_NAME:-launchops_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs Django's cache and the Celery broker.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-launchops_db}
      DB_USER: ${DB_USER:-launchops_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-compose-local-dev-secret-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000}
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:18000/api}
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  worker:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "lms_project", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-launchops_db}
      DB_USER: ${DB_USER:-launchops_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-compose-local-dev-secret-key}
      DEBUG: ${DEBUG:-True}

  beat:
    build: ./backend
    entrypoint: []
    command: ["celery", "-A", "lms_project", "beat", "--loglevel=info"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-launchops_db}
      DB_USER: ${DB_USER:-launchops_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-compose-local-dev-secret-key}
      DEBUG: ${DEBUG:-True}

volumes:
  postgres_data:
  redis_data:
